# Paste this whole file into hPanel -> VPS -> Docker Manager -> Create project -> Compose file.
# It pulls the image GitHub Actions builds (ghcr.io/mossesx/xgallery) and serves it with automatic HTTPS.
# The GHCR package must be set to public (GitHub -> your profile -> Packages -> xgallery -> Package
# settings -> Change visibility). The source repository can stay private.
services:
  app:
    image: ghcr.io/mossesx/xgallery:latest
    pull_policy: always
    container_name: xgallery-app
    restart: unless-stopped
    volumes:
      - xgallery_data:/data
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    container_name: xgallery-caddy
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      - caddy_data:/data
      - caddy_config:/config

configs:
  caddyfile:
    content: |
      xgallery.amberxai.com {
          encode zstd gzip
          reverse_proxy app:3000
          header {
              Strict-Transport-Security "max-age=31536000"
              X-Content-Type-Options "nosniff"
              Referrer-Policy "strict-origin-when-cross-origin"
          }
      }

volumes:
  xgallery_data:
  caddy_data:
  caddy_config:
