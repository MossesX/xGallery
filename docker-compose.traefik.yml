# Deployment for a server where Coolify's Traefik proxy already owns ports 80/443.
# The gallery joins the "coolify" network and registers its hostname with Traefik,
# which routes xgallery.amberxai.com to it and issues the TLS certificate.
#
#   SITE_DOMAIN=xgallery.amberxai.com docker compose -p xgallery -f docker-compose.traefik.yml up -d --build
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: xgallery-app:local
    container_name: xgallery-app
    restart: unless-stopped
    networks:
      - coolify
    labels:
      traefik.enable: "true"
      traefik.docker.network: coolify
      traefik.http.routers.xgallery-http.rule: Host(`${SITE_DOMAIN:-xgallery.amberxai.com}`)
      traefik.http.routers.xgallery-http.entrypoints: http
      traefik.http.routers.xgallery-http.middlewares: xgallery-redirect
      traefik.http.routers.xgallery-https.rule: Host(`${SITE_DOMAIN:-xgallery.amberxai.com}`)
      traefik.http.routers.xgallery-https.entrypoints: https
      traefik.http.routers.xgallery-https.tls: "true"
      traefik.http.routers.xgallery-https.tls.certresolver: letsencrypt
      traefik.http.routers.xgallery-https.service: xgallery
      traefik.http.routers.xgallery-http.service: xgallery
      traefik.http.services.xgallery.loadbalancer.server.port: "80"
      traefik.http.middlewares.xgallery-redirect.redirectscheme.scheme: https
      traefik.http.middlewares.xgallery-redirect.redirectscheme.permanent: "true"

networks:
  coolify:
    external: true
