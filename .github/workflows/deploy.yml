name: Build and deploy to Hostinger VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/mossesx/xgallery
  SITE_DOMAIN: xgallery.amberxai.com
  VPS_HOST: 31.97.13.252

jobs:
  # Publishes the image to GHCR for anyone who wants to pull it (hPanel Docker Manager etc.).
  # The deploy job below does not depend on it.
  build-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Copies this checkout to the VPS and builds + starts the stack there.
  # Repository secrets needed (Settings -> Secrets and variables -> Actions):
  #   VPS_PASSWORD   root password of the VPS (hPanel -> VPS -> Settings -> Root password)
  #   or VPS_SSH_KEY a private key whose public half is in the VPS authorized_keys
  # Optional: VPS_USER (default root)
  deploy:
    runs-on: ubuntu-latest
    concurrency: deploy-vps
    steps:
      - uses: actions/checkout@v4
      - name: Check deploy secrets are present
        env:
          HAS_PASSWORD: ${{ secrets.VPS_PASSWORD != '' }}
          HAS_KEY: ${{ secrets.VPS_SSH_KEY != '' }}
        run: |
          echo "VPS_PASSWORD set: $HAS_PASSWORD"
          echo "VPS_SSH_KEY set:  $HAS_KEY"
          if [ "$HAS_PASSWORD" != "true" ] && [ "$HAS_KEY" != "true" ]; then
            echo "::error::Neither VPS_PASSWORD nor VPS_SSH_KEY is set as a Repository secret on this repository."
            exit 1
          fi
      - name: Copy source to the VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ secrets.VPS_USER || 'root' }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "."
          target: /opt/xgallery
          rm: true
      - name: Build and start the stack on the VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ secrets.VPS_USER || 'root' }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 20m
          script: |
            set -e
            if ! command -v docker >/dev/null 2>&1; then
              curl -fsSL https://get.docker.com | sh
            fi
            cd /opt/xgallery
            export SITE_DOMAIN="${{ env.SITE_DOMAIN }}"
            if docker network inspect coolify >/dev/null 2>&1; then
              echo "Coolify/Traefik detected: registering the gallery with the existing proxy"
              docker compose -p xgallery -f docker-compose.traefik.yml up -d --build --remove-orphans
            else
              echo "No Coolify network: starting the standalone Caddy stack"
              docker compose -p xgallery -f docker-compose.yml -f docker-compose.build.yml up -d --build --remove-orphans
            fi
            docker image prune -f >/dev/null
            docker compose ps
      - name: Verify the site answers
        run: |
          echo "DNS for ${SITE_DOMAIN}: $(getent hosts "${SITE_DOMAIN}" | awk '{print $1}' | paste -sd, || echo 'does not resolve')"
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "https://${SITE_DOMAIN}/healthz" || true)
            echo "attempt $i: HTTPS /healthz -> $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "Site not reachable over HTTPS yet. Check that DNS for ${SITE_DOMAIN} points at ${VPS_HOST}."
          curl -s -o /dev/null -w "direct http://${VPS_HOST}/healthz -> %{http_code}\n" --max-time 10 "http://${VPS_HOST}/healthz" || true
          exit 1
