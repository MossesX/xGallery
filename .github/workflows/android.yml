name: Android app

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build the debug APK
        run: gradle -p android assembleDebug --no-daemon
      - name: Collect the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk xgallery-dev-panel.apk && ls -lh xgallery-dev-panel.apk
      - uses: actions/upload-artifact@v4
        with:
          name: xgallery-dev-panel-apk
          path: xgallery-dev-panel.apk
      - name: Move the android-latest tag to this commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f android-latest
          git push -f origin android-latest
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Android developer panel (latest)
          prerelease: true
          body: |
            Debug-signed APK of the xGallery developer-panel app, built from `android/` at this commit.
            Install on your phone: download `xgallery-dev-panel.apk`, allow installs from your browser, open it.
          files: xgallery-dev-panel.apk
