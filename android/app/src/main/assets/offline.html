<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #14100b; color: #f3ede4; font: 16px/1.5 system-ui, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
      .card { max-width: 420px; }
      h1 { font-size: 1.4rem; margin: 0 0 8px; }
      p { color: #b8ad9f; margin: 0 0 16px; }
      a { display: inline-block; padding: 10px 18px; border-radius: 999px; background: #ff7a1a; color: #14100b; font-weight: 700; text-decoration: none; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>You are offline</h1>
      <p>The developer panel has not been cached on this phone yet. Open it once while online and it will work offline afterwards, with the last data it saw.</p>
      <a href="https://xgallery.amberxai.com/dev">Try again</a>
    </div>
  </body>
</html>
